name: Build and scan a dev machine image
description: >-
  Builds one Dev Machines image for the runner's native architecture into the
  local Docker image store, then runs its smoke tests and HIGH/CRITICAL scan.
  Nothing is pushed; release publishing pushes the scanned local image.

inputs:
  id:
    description: Planner image id (for example ide or agent-claude)
    required: true
  context:
    description: Docker build context
    required: true
  dockerfile:
    description: Dockerfile path
    required: true
  build-args:
    description: Additional newline-separated build arguments
    required: false
    default: ''
  architecture:
    description: Native architecture (amd64 or arm64)
    required: true

outputs:
  image:
    description: Local tag of the built and scanned image
    value: kuayle-dev-machine-${{ inputs.id }}:${{ inputs.architecture }}-ci

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.2.0

    - name: Set image security refresh date
      id: security-refresh
      shell: bash
      run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

    - name: Build native architecture image
      uses: docker/build-push-action@v7.3.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/${{ inputs.architecture }}
        build-args: |
          ${{ inputs.build-args }}
          SECURITY_REFRESH=${{ steps.security-refresh.outputs.day }}
        pull: true
        push: false
        load: true
        tags: kuayle-dev-machine-${{ inputs.id }}:${{ inputs.architecture }}-ci
        cache-from: type=gha,scope=dev-machine-${{ inputs.id }}-${{ inputs.architecture }}
        cache-to: type=gha,mode=min,scope=dev-machine-${{ inputs.id }}-${{ inputs.architecture }}

    - name: Smoke test native IDE runtime
      if: inputs.id == 'ide'
      shell: bash
      run: ./devmachine/ide/smoke-test.sh kuayle-dev-machine-ide:${{ inputs.architecture }}-ci

    - name: Smoke test native headless runtime
      if: inputs.id == 'headless'
      shell: bash
      run: ./devmachine/headless/smoke-test.sh kuayle-dev-machine-headless:${{ inputs.architecture }}-ci

    - name: Scan native architecture image
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: kuayle-dev-machine-${{ inputs.id }}:${{ inputs.architecture }}-ci
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH
        trivyignores: .trivyignore.yaml
