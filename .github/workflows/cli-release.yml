name: CLI Release

# Builds the kuayle CLI for every published target and attaches the
# archives and checksums.txt to a GitHub release.
#
# - Push a tag cli-vX.Y.Z (matching CLI/Cargo.toml) to publish.
# - Run manually for a dry run: the same builds, packaging and checksum
#   verification, uploaded as a workflow artifact; nothing is published.
#
# CLI releases are never marked "latest", so they do not replace the Kuayle
# server release that self-hosting updates follow.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - id: version
        name: Read the CLI version and match it to the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' CLI/Cargo.toml | head -1)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version '$version'"; exit 1; }
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "cli-v$version" ]; then
            echo "Tag $REF_NAME does not match CLI/Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
        working-directory: CLI
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Install toolchain
        run: rustup show active-toolchain && rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --features binary-release
      - name: Build release binary
        run: cargo build --locked --release -p kuayle --features binary-release --target ${{ matrix.target }}
      - name: Smoke test
        run: ./target/${{ matrix.target }}/release/kuayle --version | grep -F "${{ needs.version.outputs.version }}"
      - name: Package
        run: |
          binary=target/${{ matrix.target }}/release/kuayle
          case "${{ matrix.target }}" in *windows*) binary=$binary.exe ;; esac
          scripts/package-release.sh ${{ matrix.target }} "$binary" ../dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: ${{ github.ref_type == 'tag' && 'Publish release' || 'Dry run' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Write and verify checksums
        run: |
          [ "$(ls dist | wc -l)" -eq 4 ] || { ls dist; echo "expected 4 archives"; exit 1; }
          sh CLI/scripts/checksums.sh dist
          (cd dist && sha256sum -c checksums.txt)
      - name: Test the installer against the release layout
        run: sh CLI/scripts/install_test.sh
      - name: Upload dry-run release
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-release-dry-run
          path: dist/*
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          Kuayle CLI $VERSION.

          Install or update with checksum verification:

              curl -fsSL https://raw.githubusercontent.com/carbogninalberto/kuayle/main/CLI/install.sh | sh

          or run \`kuayle self-update\`. Every archive is listed in checksums.txt (SHA-256).
          NOTES
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "Kuayle CLI $VERSION" --notes-file notes.md
