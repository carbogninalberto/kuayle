name: Build & Push

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
  # Rebuild an existing release tag, optionally adding the native arm64 images.
  # Automatic releases stay amd64-only; this manual path never bumps main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing server release tag to rebuild and publish (for example v0.2.32)
        required: true
        type: string
      include_arm64:
        description: Also build and publish ARM64 images (application images use QEMU)
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/carbogninalberto

permissions:
  contents: read

concurrency:
  # Same-tag release and rebuild runs share one queue; different tags may run
  # concurrently. PR runs cancel superseded work.
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('release-publish-{0}', github.event.release.tag_name || inputs.release_tag) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI Impact
    uses: ./.github/workflows/ci-impact.yml
    with:
      include_arm64: ${{ inputs.include_arm64 || false }}

  # Automatic releases first commit the version bump and refreshed agent CLIs,
  # then build the application and runtime images from that commit in parallel.
  # A manual republish builds an existing tag instead and skips this job.
  release-source:
    needs: [changes]
    # cli-v* releases are published by CLI Release, not as a server release.
    if: github.event_name == 'release' && needs.changes.result == 'success' && !startsWith(github.event.release.tag_name, 'cli-v')
    name: Prepare Release Source
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      contents: write
    concurrency:
      # Serialize the version-bump commit across different release tags.
      group: release-source
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Validate release tag before committing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag is not a valid server/Docker tag"
            exit 1
          fi

      - name: Checkout main for release build
        uses: actions/checkout@v7.0.0
        with:
          ref: main
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          version="${{ github.event.release.tag_name }}"
          number="${version#v}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Bump UI version
        working-directory: UI
        run: npm version "${{ steps.version.outputs.number }}" --no-git-tag-version --allow-same-version

      - name: Update public release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | jq '[.[] | select(.draft == false and .published_at != null) | {
                tag_name,
                html_url,
                body,
                published_at,
                prerelease,
                force_upgrade: false,
                minimum_supported_version: null,
                upgrade_url: .html_url,
                upgrade_message: null
              }]' \
            > UI/static/releases.json

      - name: Update README contributors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/contributors?per_page=100" --slurp \
            | jq -r 'add
              | map(select(.type == "User"))
              | map("<a href=\"\(.html_url)\"><img src=\"\(.avatar_url)&amp;s=64\" width=\"64\" height=\"64\" alt=\"@\(.login)\" title=\"@\(.login)\"></a>")
              | join("\n")' \
            > /tmp/contributors.html

          sed '/<!-- contributors:start -->/q' README.md > /tmp/README.md
          cat /tmp/contributors.html >> /tmp/README.md
          sed -n '/<!-- contributors:end -->/,$p' README.md >> /tmp/README.md
          mv /tmp/README.md README.md

      - name: Upgrade all built-in agent CLIs to latest stable versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/upgrade-agent-clis.mjs

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md UI/package.json UI/package-lock.json UI/static/releases.json
          git add devmachine/common/install-agent-clis.sh devmachine/{agent,ide,headless}/Dockerfile

          if git diff --cached --quiet; then
            echo "Version is already ${{ steps.version.outputs.version }}"
          else
            git commit -m "bump(version): ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Record refreshed release source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # One validated source and tag selection for automatic releases and manual
  # republishes. A manual run reuses the release bump commit and never creates a
  # new one. The latest-tag writers recheck the current release immediately
  # before promoting.
  release-context:
    name: Resolve Release Context
    needs: [changes, release-source]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && (github.event_name != 'release' || needs.release-source.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      source_ref: ${{ steps.context.outputs.source_ref }}
      include_arm64: ${{ steps.context.outputs.include_arm64 }}
    steps:
      - name: Checkout release source for the context lookup
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || needs.release-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag, source and architecture selection
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
          INCLUDE_ARM64: ${{ contains(fromJSON(needs.changes.outputs.plan).architectures, 'arm64') }}
        run: bash scripts/ci/release-context.sh

  build:
    needs: [changes, release-source, release-context]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.release-context.result == 'success' }}
    name: Build Images (${{ matrix.image.name }})
    # PR application images are built, smoke-tested and scanned by Release Readiness.
    permissions:
      contents: read
      packages: write
    concurrency:
      # Same tag + image cannot be built twice at once; different tags may run
      # in parallel.
      group: release-build-${{ needs.release-context.outputs.tag }}-${{ matrix.image.package }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.plan).releaseImages }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-context.outputs.source_ref }}
          persist-credentials: false

      - name: Extract version
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          version="$RELEASE_TAG"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=${version#v}" >> "$GITHUB_OUTPUT"

      # QEMU is only needed for the opt-in multi-platform application build.
      # Dev-machine and readiness ARM64 builds use native runners.
      - name: Set up QEMU for optional ARM64 application images
        if: ${{ needs.release-context.outputs.include_arm64 == 'true' }}
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image security refresh date
        id: security-refresh
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The API image alone receives the release version build argument.
      - name: Build & push API
        if: matrix.image.id == 'api'
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ needs.release-context.outputs.include_arm64 == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          build-args: |
            SECURITY_REFRESH=${{ steps.security-refresh.outputs.day }}
            VERSION=${{ steps.version.outputs.number }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}:${{ needs.release-context.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image.id }}-${{ needs.release-context.outputs.include_arm64 == 'true' && 'multi' || 'amd64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.id }}-${{ needs.release-context.outputs.include_arm64 == 'true' && 'multi' || 'amd64' }}

      - name: Build & push application image
        if: matrix.image.id != 'api'
        uses: docker/build-push-action@v7.2.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ needs.release-context.outputs.include_arm64 == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          pull: true
          build-args: SECURITY_REFRESH=${{ steps.security-refresh.outputs.day }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}:${{ needs.release-context.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image.id }}-${{ needs.release-context.outputs.include_arm64 == 'true' && 'multi' || 'amd64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.id }}-${{ needs.release-context.outputs.include_arm64 == 'true' && 'multi' || 'amd64' }}

  # Promote :latest only after every application image built successfully.
  # imagetools copies the existing index, and the digest check below rejects any
  # promotion that would drop provenance attestations.
  promote-latest:
    needs: [changes, release-context, build, dev-machine-publish]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.release-context.result == 'success' && needs.build.result == 'success' && needs.dev-machine-publish.result == 'success' }}
    name: Promote Application Image to Latest (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Serialize latest writers per image across different release tags.
      group: latest-${{ matrix.image.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.plan).releaseImages }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm release is still latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if ! current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "::error::could not confirm the latest release"
            exit 1
          fi
          if [ "$current" = "$RELEASE_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote image to latest by digest
        if: steps.latest.outputs.publish == 'true'
        env:
          REPOSITORY: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          VERSION: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          source="${REPOSITORY}:${VERSION}"
          before=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools create --tag "${REPOSITORY}:latest" "$source"
          after=$(docker buildx imagetools inspect "${REPOSITORY}:latest" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$before" != "$after" ]; then
            echo "::error::latest promotion changed the image digest; refusing partial attestations"
            exit 1
          fi
          echo "Promoted ${source} (${before}) to ${REPOSITORY}:latest"

  dev-machine-images:
    needs: [changes, release-source]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'release' || needs.release-source.result == 'success') && contains(fromJSON(needs.changes.outputs.plan).required.build, 'dev-machine-images') }}
    name: Dev Machine Image (${{ matrix.image.name }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.changes.outputs.plan).architectures }}
        image: ${{ fromJSON(needs.changes.outputs.plan).devImages }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-source.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build, smoke test and scan native architecture image
        uses: ./.github/actions/dev-machine-image
        with:
          id: ${{ matrix.image.id }}
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build_args }}
          architecture: ${{ matrix.architecture }}

  # Releases run the same native build/smoke/scan once here instead of in
  # dev-machine-images, then push exactly the scanned local image. The release
  # updater pulls these images rather than building them on the server. Automatic
  # releases are amd64-only; include_arm64 adds the native arm64 jobs. The matrix
  # is unbounded so it runs alongside Build Images; GitHub queues any jobs beyond
  # the account's runner concurrency.
  dev-machine-publish:
    needs: [changes, release-source, release-context]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.release-context.result == 'success' && contains(fromJSON(needs.changes.outputs.plan).required.build, 'dev-machine-publish') }}
    name: Publish Dev Machine Image (${{ matrix.image.name }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      # Same tag + image + architecture cannot be published twice at once.
      group: release-dev-${{ needs.release-context.outputs.tag }}-${{ matrix.image.id }}-${{ matrix.architecture }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.changes.outputs.plan).architectures }}
        image: ${{ fromJSON(needs.changes.outputs.plan).devImages }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release-context.outputs.source_ref }}
          persist-credentials: false

      - name: Build, smoke test and scan native architecture image
        id: image
        uses: ./.github/actions/dev-machine-image
        with:
          id: ${{ matrix.image.id }}
          context: ${{ matrix.image.context }}
          dockerfile: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build_args }}
          architecture: ${{ matrix.architecture }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned architecture image
        env:
          SOURCE: ${{ steps.image.outputs.image }}
          TARGET: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}:${{ needs.release-context.outputs.tag }}-${{ matrix.architecture }}
        run: |
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"

  dev-machine-manifests:
    needs: [changes, release-context, build, dev-machine-publish]
    if: ${{ !cancelled() && needs.release-context.result == 'success' && needs.build.result == 'success' && needs.dev-machine-publish.result == 'success' && contains(fromJSON(needs.changes.outputs.plan).required.build, 'dev-machine-manifests') }}
    name: Publish Dev Machine Manifest (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Serialize latest writers per image across different release tags.
      group: latest-${{ matrix.image.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.plan).devImages }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm release is still latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          set -euo pipefail
          if ! current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            echo "::error::could not confirm the latest release"
            exit 1
          fi
          if [ "$current" = "$RELEASE_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release manifest for the selected architectures
        env:
          REPOSITORY: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.package }}
          VERSION: ${{ needs.release-context.outputs.tag }}
          INCLUDE_ARM64: ${{ needs.release-context.outputs.include_arm64 }}
          PUBLISH_LATEST: ${{ steps.latest.outputs.publish }}
        run: |
          set -euo pipefail

          sources=("$REPOSITORY:$VERSION-amd64")
          if [ "$INCLUDE_ARM64" = "true" ]; then
            sources+=("$REPOSITORY:$VERSION-arm64")
          fi

          tags=(--tag "$REPOSITORY:$VERSION")
          if [ "$PUBLISH_LATEST" = "true" ]; then
            tags+=(--tag "$REPOSITORY:latest")
          fi

          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$REPOSITORY:$VERSION"

  result:
    name: Build CI Result
    if: always()
    needs: [changes, release-source, release-context, build, promote-latest, dev-machine-images, dev-machine-publish, dev-machine-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs build
