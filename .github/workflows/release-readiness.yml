name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Release image (${{ matrix.image.id }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: [amd64, arm64]
        image:
          - id: all-in-one
            context: .
            dockerfile: ./Dockerfile
          - id: api
            context: ./BE
            dockerfile: ./BE/Dockerfile
          - id: web
            context: ./UI
            dockerfile: ./UI/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          # Record and validate the reviewed commit, not a synthetic PR merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Record source and security refresh
        id: source
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-commit.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build release candidate without publishing
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          pull: true
          push: false
          load: true
          build-args: SECURITY_REFRESH=${{ steps.source.outputs.day }}
          tags: kuayle-readiness-${{ matrix.image.id }}:${{ matrix.architecture }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=readiness-${{ matrix.image.id }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=min,scope=readiness-${{ matrix.image.id }}-${{ matrix.architecture }}

      - name: Record image identity
        env:
          IMAGE: kuayle-readiness-${{ matrix.image.id }}:${{ matrix.architecture }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          docker image inspect "$IMAGE" > evidence/image-inspect.json
          printf '%s\n' "$BUILD_DIGEST" > evidence/build-digest.txt
          printf '%s\n' "$BUILD_METADATA" > evidence/build-metadata.json
          docker image save --output evidence/image.tar "$IMAGE"

      - name: Verify packaged runtime and proxy routes
        env:
          IMAGE: kuayle-readiness-${{ matrix.image.id }}:${{ matrix.architecture }}
          KIND: ${{ matrix.image.id }}
        run: python3 -u selfhosting/image_smoke_test.py "$IMAGE" "$KIND" 2>&1 | tee evidence/runtime.log

      - name: Scan release candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.75.0
          image-ref: kuayle-readiness-${{ matrix.image.id }}:${{ matrix.architecture }}
          scanners: vuln,secret
          format: json
          output: evidence/trivy.json
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Upload source, image and scan evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-readiness-${{ matrix.image.id }}-${{ matrix.architecture }}
          path: evidence/
          retention-days: 30
          compression-level: 0
