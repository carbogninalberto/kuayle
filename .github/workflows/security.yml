name: Security Scan

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  changes:
    name: CI Impact
    uses: ./.github/workflows/ci-impact.yml

  go-security:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).backend }}
    name: Go Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BE
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: BE/go.mod

      - name: Run govulncheck
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build check
        run: go build ./...

      # PR race tests already run with a database and coverage in Tests.
      - name: Run tests
        if: github.event_name != 'pull_request'
        run: go test ./... -race -count=1

  frontend-security:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.plan).frontend }}
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./UI
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      # Frontend Checks builds before its PR browser suite.
      - name: Build check
        if: github.event_name != 'pull_request'
        run: npm run build

  docker-security:
    needs: changes
    if: github.event_name != 'pull_request'
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build backend image
        run: docker build --pull --build-arg SECURITY_REFRESH="$(date -u +%F)" -t kuayle-backend:scan ./BE

      - name: Build frontend image
        run: docker build --pull --build-arg SECURITY_REFRESH="$(date -u +%F)" -t kuayle-frontend:scan ./UI

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kuayle-backend:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kuayle-frontend:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  dev-machine-security:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.plan).required.security, 'dev-machine-security') }}
    name: Dev Machine Security Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Bound image fan-out while preserving every architecture and scan.
      max-parallel: 4
      matrix:
        # On PRs only updater remains here; Build & Push scans the other
        # selected runtime images on both native architectures.
        include: ${{ fromJSON(needs.changes.outputs.plan).securityImages }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Set image security refresh date
        id: security-refresh
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            ${{ matrix.build_args }}
            SECURITY_REFRESH=${{ steps.security-refresh.outputs.day }}
          pull: true
          load: true
          tags: kuayle-dev-machine-${{ matrix.id }}:scan
          cache-from: type=gha,scope=dev-machine-scan-${{ matrix.id }}
          cache-to: type=gha,mode=min,scope=dev-machine-scan-${{ matrix.id }}

      - name: Smoke test IDE runtime
        if: matrix.id == 'ide'
        run: ./devmachine/ide/smoke-test.sh kuayle-dev-machine-ide:scan

      - name: Smoke test headless runtime
        if: matrix.id == 'headless'
        run: ./devmachine/headless/smoke-test.sh kuayle-dev-machine-headless:scan

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kuayle-dev-machine-${{ matrix.id }}:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  result:
    name: Security CI Result
    if: always()
    needs: [changes, go-security, frontend-security, docker-security, dev-machine-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs security
