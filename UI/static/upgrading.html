<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Kuayle is upgrading</title>
		<style>
			:root {
				color-scheme: dark;
				--background: #111111;
				--foreground: #f5f5f5;
				--card: #191919;
				--card-foreground: #f5f5f5;
				--muted: #222222;
				--muted-foreground: #a0a0a0;
				--border: #2f2f2f;
				--primary: #6650eb;
				--primary-foreground: #ffffff;
				--ring: rgba(149, 133, 245, 0.45);
			}

			* {
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 24px;
				background: var(--background);
				color: var(--foreground);
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
			}

			main {
				width: min(100%, 420px);
				border: 1px solid var(--border);
				border-radius: 16px;
				background: var(--card);
				box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
			}

			.card-header {
				padding: 24px 24px 0;
			}

			.brand {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				color: var(--card-foreground);
				font-size: 14px;
				font-weight: 600;
			}

			.logo {
				width: 32px;
				height: 32px;
				display: block;
				border-radius: 8px;
			}

			h1 {
				margin: 24px 0 0;
				font-size: 24px;
				line-height: 1.2;
				letter-spacing: -0.025em;
				font-weight: 650;
			}

			.card-content {
				padding: 16px 24px 24px;
			}

			p {
				margin: 0;
				color: var(--muted-foreground);
				font-size: 14px;
				line-height: 1.6;
			}

			.status {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 20px;
				padding: 12px;
				border: 1px solid var(--border);
				border-radius: 12px;
				background: var(--muted);
				color: var(--card-foreground);
				font-size: 14px;
			}

			.pulse {
				width: 8px;
				height: 8px;
				flex: 0 0 auto;
				border-radius: 999px;
				background: var(--primary);
				box-shadow: 0 0 0 var(--ring);
				animation: pulse 1.6s infinite;
			}

			.card-footer {
				display: flex;
				flex-wrap: wrap;
				justify-content: flex-end;
				gap: 8px;
				padding: 0 24px 24px;
			}

			button,
			a {
				height: 36px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				border-radius: 8px;
				padding: 0 12px;
				font: inherit;
				font-size: 14px;
				font-weight: 500;
				text-decoration: none;
				cursor: pointer;
			}

			button {
				border: 0;
				background: var(--primary);
				color: var(--primary-foreground);
			}

			a {
				border: 1px solid var(--border);
				background: transparent;
				color: var(--card-foreground);
			}

			@keyframes pulse {
				0% {
					box-shadow: 0 0 0 0 var(--ring);
				}
				70% {
					box-shadow: 0 0 0 10px rgba(149, 133, 245, 0);
				}
				100% {
					box-shadow: 0 0 0 0 rgba(149, 133, 245, 0);
				}
			}

			@media (max-width: 480px) {
				.card-footer {
					flex-direction: column-reverse;
				}

				button,
				a {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section class="card-header">
				<div class="brand" aria-label="Kuayle">
					<svg class="logo" viewBox="0 0 37.384865 37.384415" aria-hidden="true" focusable="false">
						<!-- Inline so the logo renders while the proxy rewrites every path to this page. -->
						<g transform="translate(-25.270224,-20.407445)">
							<path fill="#6650eb" d="m 38.554101,20.407446 c -7.359243,0 -13.283878,5.924636 -13.283878,13.283878 v 10.816657 c 0,7.359242 5.924635,13.283877 13.283878,13.283877 h 10.817111 c 7.359242,0 13.283877,-5.924635 13.283877,-13.283877 V 33.691324 c 0,-7.359242 -5.924635,-13.283878 -13.283877,-13.283878 z m -1.479062,5.972051 a 1.7559255,1.7559255 0 0 1 1.757179,1.757179 v 6.473389 c 2.101713,-2.316579 4.948112,-3.93718 8.195634,-4.323305 0.71585,-2.253946 2.838044,-3.907263 5.315548,-3.907263 3.057093,0 5.574156,2.517065 5.574156,5.574156 0,3.057093 -2.517063,5.574157 -5.574156,5.574157 -2.405288,0 -4.475109,-1.558803 -5.248854,-3.712173 -4.222889,0.618711 -7.538644,3.934237 -8.157523,8.15707 2.153611,0.773612 3.712173,2.843843 3.712173,5.249307 0,3.057092 -2.517064,5.574155 -5.574157,5.574155 -3.057092,0 -5.574156,-2.517063 -5.574156,-5.574155 0,-2.444287 1.609788,-4.541863 3.817431,-5.28515 V 28.136676 a 1.7559255,1.7559255 0 0 1 1.756725,-1.757179 z M 52.3434,29.893402 c -1.159153,0 -2.059797,0.901099 -2.059797,2.060251 0,1.159153 0.900644,2.060251 2.059797,2.060251 1.159152,0 2.060251,-0.901098 2.060251,-2.060251 0,-1.159152 -0.901099,-2.060251 -2.060251,-2.060251 z M 37.075039,45.161763 c -1.159153,0 -2.059797,0.901098 -2.059797,2.060251 0,1.159153 0.900644,2.060251 2.059797,2.060251 1.159153,0 2.060251,-0.901098 2.060251,-2.060251 0,-1.159153 -0.901098,-2.060251 -2.060251,-2.060251 z" />
						</g>
					</svg>
					<span>Kuayle</span>
				</div>
				<h1>Upgrade in progress</h1>
			</section>
			<section class="card-content">
				<p>
					Kuayle is temporarily unavailable while the server restarts services and applies any pending migrations.
					Existing work is safe.
				</p>
				<div class="status" aria-live="polite">
					<span class="pulse" aria-hidden="true"></span>
					<span>Waiting for the update to finish</span>
				</div>
			</section>
			<div class="card-footer">
				<a href="https://github.com/carbogninalberto/kuayle/releases" rel="noopener">Release notes</a>
				<button type="button" id="retry">Try again</button>
			</div>
		</main>
		<script>
			(function () {
				var page = '/upgrading.html';
				// Only same-origin app paths are valid return targets.
				function appPath(value) {
					if (!value || value.charAt(0) !== '/' || value.charAt(1) === '/' || value.charAt(1) === '\\') return null;
					try {
						var url = new URL(value, window.location.origin);
						if (url.origin !== window.location.origin || url.pathname === page) return null;
						return url.pathname + url.search + url.hash;
					} catch (error) {
						return null;
					}
				}
				var here = window.location.pathname + window.location.search + window.location.hash;
				var returnTo =
					appPath(new URLSearchParams(window.location.search).get('return')) ||
					(window.location.pathname === page ? '/' : here);

				document.getElementById('retry').addEventListener('click', function () {
					window.location.assign(returnTo);
				});

				// While maintenance is active the proxy answers every path with this
				// page, so only a JSON reply from the backend means the update ended.
				function check() {
					fetch('/api/public/system/update-activity', { cache: 'no-store', credentials: 'omit' })
						.then(function (response) {
							var type = response.headers.get('content-type') || '';
							return response.ok && type.indexOf('application/json') !== -1 ? response.json() : null;
						})
						.then(function (activity) {
							if (activity && activity.running === false) window.location.replace(returnTo);
							else window.setTimeout(check, 3000);
						})
						.catch(function () {
							window.setTimeout(check, 3000);
						});
				}
				window.setTimeout(check, 3000);
			})();
		</script>
	</body>
</html>
