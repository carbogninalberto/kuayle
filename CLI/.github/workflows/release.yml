name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --locked
      - name: Build release binary
        run: cross build --release --target ${{ matrix.target }} -p kuayle --features binary-release
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kuayle-${{ matrix.target }}.tar.gz kuayle
      - uses: actions/upload-artifact@v4
        with:
          name: kuayle-${{ matrix.target }}
          path: kuayle-${{ matrix.target }}.tar.gz

  build-macos:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p kuayle --features binary-release
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../kuayle-${{ matrix.target }}.tar.gz kuayle
      - uses: actions/upload-artifact@v4
        with:
          name: kuayle-${{ matrix.target }}
          path: kuayle-${{ matrix.target }}.tar.gz

  build-windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc -p kuayle --features binary-release
      - name: Package
        run: |
          cd target/x86_64-pc-windows-msvc/release
          7z a ../../../kuayle-x86_64-pc-windows-msvc.zip kuayle.exe
      - uses: actions/upload-artifact@v4
        with:
          name: kuayle-x86_64-pc-windows-msvc
          path: kuayle-x86_64-pc-windows-msvc.zip

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate checksums
        run: sha256sum */*.tar.gz */*.zip > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            */*.tar.gz
            */*.zip
            checksums.txt
          generate_release_notes: true
